name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Streamlit App
        run: |
          for i in {1..3}; do
            if curl --fail --silent --show-error --location --max-time 120 \
              https://dsproject-crispdm-bank-campaign-cost-optimizer.streamlit.app; then
              echo "Streamlit app is awake."
              exit 0
            fi

            echo "Attempt $i failed. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Failed to reach Streamlit app."
          exit 1
